<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>外出位置共享</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f1f5f9; color: #334155; }
  .card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  h2 { margin: 0 0 16px; font-size: 1.2rem; }
  label { display: block; font-weight: bold; font-size: .9rem; margin: 12px 0 4px; }
  input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
  button { width: 100%; padding: 14px; margin-top: 12px; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
  .btn-go { background: #3b82f6; color: #fff; }
  .btn-sub { background: #e2e8f0; color: #334155; }
  .btn-leave { background: #ef4444; color: #fff; }
  #view-map { display: none; height: 100vh; height: 100dvh; flex-direction: column; overscroll-behavior: none; }
  #map { flex: 1; min-height: 0; }
  #bar { padding: 8px 10px; background: #fff; display: flex; gap: 8px; align-items: center; box-shadow: 0 -2px 8px rgba(0,0,0,.08); font-size: .85rem; }
  #bar .info { flex: 1; font-size: .82rem; line-height: 1.5; }
  #bar .info b { font-size: 1.05rem; letter-spacing: 2px; color: #1d4ed8; }
  #bar button { width: auto; margin: 0; padding: 12px 16px; font-size: 1rem; }
  #members { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; padding: 8px 12px; background: #f8fafc; font-size: .85rem; }
  .chip { cursor: pointer; white-space: nowrap; user-select: none; }
  .chip.sel { outline: 2px solid #4f46e5; }
  #peerinfo { display: none; padding: 6px 12px; background: #eef2ff; color: #3730a3; font-size: .85rem; font-weight: bold; }
  #members { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; background: #f8fafc; font-size: .85rem; }
  .chip { background: #e0e7ff; color: #3730a3; border-radius: 12px; padding: 2px 10px; }
  .chip.stale { background: #e2e8f0; color: #64748b; }
  .err { color: #dc2626; font-size: .9rem; margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="card" id="view-home">
  <h2>📍 外出位置共享</h2>
  <label for="in-name">你的名稱</label>
  <input id="in-name" placeholder="例如：志成" maxlength="20" autocomplete="off">
  <label for="in-dest">目的地（發起人填）</label>
  <div style="display:flex; gap:8px">
    <input id="in-dest" placeholder="例如：台北101" autocomplete="off" style="flex:1">
    <button class="btn-sub" id="btn-search" style="width:auto; margin-top:0; padding:12px 16px; white-space:nowrap">搜尋</button>
  </div>
  <div id="dest-results" style="margin-top:8px"></div>
  <label for="in-mode">交通方式（發起人選）</label>
  <select id="in-mode" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;background:#fff">
    <option value="DRIVE">汽車</option>
    <option value="TWO_WHEELER">機車</option>
    <option value="TRANSIT">大眾運輸</option>
    <option value="WALK">步行</option>
    <option value="BICYCLE">自行車</option>
  </select>
  <button class="btn-go" id="btn-create">發起新的共享</button>
  <label for="in-code">加入代碼（6 碼）</label>
  <input id="in-code" placeholder="例如：A3K9P2" maxlength="6" autocomplete="off" style="text-transform:uppercase">
  <button class="btn-sub" id="btn-join">加入共享</button>
  <div class="err" id="home-err"></div>
</div>

<div id="view-map">
  <div id="members"></div>
  <div id="peerinfo"></div>
  <div id="map"></div>
  <div id="bar">
    <div class="info">代碼 <b id="my-code"></b>｜🎯 <span id="my-dest">—</span><br>🛣️ <span id="my-route">—</span>｜⏳ <span id="my-left"></span>｜<span id="my-status">定位中…</span></div>
    <button class="btn-sub" id="btn-extend" style="display:none">＋2小時</button>
    <button class="btn-leave" id="btn-leave">離開</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
"use strict";
/* ===== 請填入你自己的設定 ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBEocXvvrljdDB2ZvLYAOVP6RlX1YsiDjE",
  authDomain: "outing-tracker-bbfac.firebaseapp.com",
  databaseURL: "https://outing-tracker-bbfac-default-rtdb.firebaseio.com",
  projectId: "outing-tracker-bbfac",
  appId: "1:427493375703:web:b28fea435c58e48c593a92"
};
const GOOGLE_MAPS_KEY = "AIzaSyD5hJgTozfzrzdlObL8LTrAv2NRe3VEsEc";
/* ============================ */
const PUSH_EVERY_MS = 10000;   // 每 10 秒上傳位置
const STALE_MS = 120000;       // 超過 2 分鐘沒更新視為離線

let db = null, map = null, markers = {}, watchId = null, pushTimer = null, leftTimer = null;
let myCode = "", myName = "", myKey = "", myRef = null, membersRef = null, sessionRef = null;
let destMarker = null, routeLine = null, peerLine = null, iconCache = {};
let lastDest = null, lastRoute = null, lastList = null, myPos = null, peerKey = null;
let expiresAt = 0, isCreator = false, chosenPlace = null, routeErrs = [];
const SESSION_MS = 2 * 3600 * 1000;  // 每次 2 小時

const $ = id => document.getElementById(id);
const err = m => { $("home-err").innerText = m; };

function rndCode() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}

function initFirebase() {
  if (!db) {
    if (!FIREBASE_CONFIG.databaseURL || FIREBASE_CONFIG.databaseURL === "PASTE_HERE")
      throw new Error("還沒填 FIREBASE_CONFIG（看 README 申請步驟）");
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  }
}

function loadMaps() {
  return new Promise((resolve, reject) => {
    if (window.google && window.google.maps) return resolve();
    if (!GOOGLE_MAPS_KEY || GOOGLE_MAPS_KEY === "PASTE_HERE")
      return reject(new Error("還沒填 GOOGLE_MAPS_KEY（看 README 申請步驟）"));
    window.__mapsResolve = () => { try { delete window.__mapsResolve; } catch (e) {} resolve(); };
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + GOOGLE_MAPS_KEY + "&loading=async&callback=__mapsResolve";
    s.onerror = () => reject(new Error("Google Maps 載入失敗，檢查金鑰"));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error("Google Maps 載入逾時，檢查網路")), 20000);
  });
}

function pushPos(pos) {
  if (!myRef) return;
  myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
  myRef.set({
    name: myName,
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    acc: Math.round(pos.coords.accuracy || 0),
    updatedAt: Date.now()
  });
  $("my-status").innerText = "已更新 " + new Date().toLocaleTimeString();
}

function startTracking() {
  if (!navigator.geolocation) { err("此瀏覽器不支援定位"); return; }
  const onPos = p => {
    if (!map) {
      map = new google.maps.Map($("map"), { center: { lat: p.coords.latitude, lng: p.coords.longitude }, zoom: 15 });
      if (lastDest) showDest(lastDest);
      drawRoute();
      if (lastList) renderMembers(lastList);  // 地圖建好後重畫標記（修加入者空白）
    }
    pushPos(p);
  };
  const onErr = e => { $("my-status").innerText = "定位失敗（請開定位權限）"; };
  watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000 });
  // 每 10 秒強制推一次（即使沒移動）
  pushTimer = setInterval(() => {
    navigator.geolocation.getCurrentPosition(pushPos, () => {}, { enableHighAccuracy: true });
  }, PUSH_EVERY_MS);
}

function hashHue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function iconFor(name) {
  if (iconCache[name]) return iconCache[name];
  const c = document.createElement("canvas"); c.width = 128; c.height = 52;
  const x = c.getContext("2d");
  x.fillStyle = "hsl(" + hashHue(name || "?") + ",70%,45%)";
  x.beginPath();
  if (x.roundRect) x.roundRect(14, 2, 100, 34, 17); else x.rect(14, 2, 100, 34);
  x.fill();
  x.beginPath(); x.moveTo(56, 36); x.lineTo(72, 36); x.lineTo(64, 50); x.closePath(); x.fill();
  x.fillStyle = "#fff"; x.font = "bold 19px sans-serif"; x.textAlign = "center";
  x.fillText((name || "?").slice(0, 5), 64, 27);
  const icon = { url: c.toDataURL(), scaledSize: new google.maps.Size(64, 26), anchor: new google.maps.Point(32, 26) };
  iconCache[name] = icon;
  return icon;
}

function haversineM(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function fmtDist(m) {
  return m < 1000 ? "相距約" + Math.round(m) + "公尺" : "相距約" + (m / 1000).toFixed(1) + "公里";
}

function selectPeer(key) {
  peerKey = (peerKey === key) ? null : key;  // 再點一次取消
  drawPeer();
  if (lastList) renderMembers(lastList);
}

function drawPeer() {
  if (peerLine) { peerLine.setMap(null); peerLine = null; }
  const bar = $("peerinfo");
  const peer = peerKey && lastList ? lastList[peerKey] : null;
  if (!peer || !myPos || typeof peer.lat !== "number" || !map) {
    bar.style.display = "none";
    bar.innerText = "";
    return;
  }
  const a = myPos, b = { lat: peer.lat, lng: peer.lng };
  peerLine = new google.maps.Polyline({
    path: [a, b], map, geodesic: true, strokeOpacity: 0,
    icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: 1, strokeWeight: 2, scale: 2 }, offset: "0", repeat: "12px" }]
  });
  bar.style.display = "block";
  bar.innerText = "我 ↔ " + (peer.name || peerKey) + "：" + fmtDist(haversineM(a, b));
}

function renderMembers(list) {
  lastList = list;
  const box = $("members");
  box.innerHTML = "";
  const now = Date.now();
  Object.keys(list || {}).forEach(key => {
    const m = list[key];
    const stale = now - (m.updatedAt || 0) > STALE_MS;
    const chip = document.createElement("span");
    chip.className = "chip" + (stale ? " stale" : "") + (key === peerKey ? " sel" : "");
    chip.innerText = (m.name || key) + (stale ? "（離線）" : "");
    chip.onclick = () => selectPeer(key);
    box.appendChild(chip);
    if (!map) return;  // 地圖還沒好只畫名單，標記等地圖建好重畫
    if (!stale && typeof m.lat === "number") {
      const pos = { lat: m.lat, lng: m.lng };
      if (!markers[key]) {
        markers[key] = new google.maps.Marker({ map, position: pos, title: m.name || key, icon: iconFor(m.name || key) });
      } else {
        markers[key].setPosition(pos);
        markers[key].setIcon(iconFor(m.name || key));
      }
    } else if (markers[key]) {
      markers[key].setMap(null);
      delete markers[key];
    }
  });
  // 自己置中一次就好（之後手動拖地圖）
  if (map && !map.__centered && myKey) {
    const me = (list || {})[myKey];
    if (me && typeof me.lat === "number") {
      map.setCenter({ lat: me.lat, lng: me.lng });
      map.__centered = true;
    }
  }
  drawPeer();  // 有選人就重畫虛線＋距離
}

const MODE_LABEL = { DRIVE: "汽車", TWO_WHEELER: "機車", TRANSIT: "大眾運輸", WALK: "步行", BICYCLE: "自行車" };

async function routeViaDirections(o, d, mode) {
  const m = { DRIVE: "DRIVING", TWO_WHEELER: "DRIVING", TRANSIT: "TRANSIT", WALK: "WALKING", BICYCLE: "BICYCLING" };
  return new Promise((resolve, reject) => {
    new google.maps.DirectionsService().route({
      origin: { lat: o.lat, lng: o.lng },
      destination: { lat: d.lat, lng: d.lng },
      travelMode: m[mode] || "DRIVING"
    }, (res, status) => {
      if (status !== "OK" || !res.routes || !res.routes.length)
        return reject(new Error("Directions:" + status));
      const leg = res.routes[0].legs[0];
      resolve({
        poly: res.routes[0].overview_polyline,
        distM: leg.distance.value,
        durS: leg.duration.value
      });
    });
  });
}

async function routeViaRoutesApi(o, d, mode) {
  const res = await fetch("https://routes.googleapis.com/directions/v2:routes", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Goog-Api-Key": GOOGLE_MAPS_KEY,
      "X-Goog-FieldMask": "routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline"
    },
    body: JSON.stringify({
      origin: { location: { latLng: { latitude: o.lat, longitude: o.lng } } },
      destination: { location: { latLng: { latitude: d.lat, longitude: d.lng } } },
      travelMode: mode, languageCode: "zh-TW", units: "METRIC"
    })
  });
  if (!res.ok) throw new Error("路線規劃失敗（" + res.status + "）：檢查 Routes API 有無啟用");
  const j = await res.json();
  if (!j.routes || !j.routes.length) throw new Error("查無路線，換交通方式或地點試試");
  const r = j.routes[0];
  return { poly: r.polyline.encodedPolyline, distM: r.distanceMeters, durS: parseInt(r.duration) || 0 };
}

// 三級：內建 Directions → Routes API → 起訖直線（保證有線）
async function computeRoute(o, d, mode) {
  try { return await routeViaDirections(o, d, mode); } catch (e) {}
  try { return await routeViaRoutesApi(o, d, mode); } catch (e) {}
  return { straight: [o, d], distM: Math.round(haversineM(o, d)), durS: null };
}

function decodePoly(enc) {
  let lat = 0, lng = 0, out = [], i = 0;
  while (i < enc.length) {
    let b, shift = 0, res = 0;
    do { b = enc.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
    lat += (res & 1) ? ~(res >> 1) : (res >> 1);
    shift = 0; res = 0;
    do { b = enc.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
    lng += (res & 1) ? ~(res >> 1) : (res >> 1);
    out.push({ lat: lat / 1e5, lng: lng / 1e5 });
  }
  return out;
}

function drawRoute() {
  if (routeLine) { routeLine.setMap(null); routeLine = null; }
  if (!map || !lastRoute) return;
  if (lastRoute.poly) {
    routeLine = new google.maps.Polyline({
      path: decodePoly(lastRoute.poly),
      geodesic: true, strokeColor: "#2563eb", strokeOpacity: 0.9, strokeWeight: 5, map
    });
  } else if (lastRoute.straight) {
    routeLine = new google.maps.Polyline({
      path: lastRoute.straight,
      geodesic: true, strokeOpacity: 0, map,
      icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: 1, strokeWeight: 2, scale: 2 }, offset: "0", repeat: "12px" }]
    });
  }
}

function routeText() {
  if (!lastRoute) return "—";
  const km = (lastRoute.distM / 1000).toFixed(1);
  if (lastRoute.durS == null) return "直線 " + km + "公里";
  const min = Math.round(lastRoute.durS / 60);
  return (MODE_LABEL[lastRoute.mode] || "") + " " + km + "公里 約" + min + "分";
}

async function enterMap(code) {
  myCode = code;
  $("my-code").innerText = code;
  $("view-home").style.display = "none";
  $("view-map").style.display = "flex";
  membersRef = db.ref("sessions/" + code + "/members");
  if (!myKey) myKey = myName + "_" + Math.random().toString(36).slice(2, 6);
  try { localStorage.setItem("outing_last", JSON.stringify({ code, name: myName })); } catch (e) {}
  myRef = membersRef.child(myKey);
  await myRef.onDisconnect().remove();   // 關網頁自動清除
  membersRef.on("value", snap => renderMembers(snap.val()));
  sessionRef = db.ref("sessions/" + code);
  sessionRef.on("value", snap => {
    const s = snap.val();
    if (!s) return expireLeave("本次共享已結束");
    expiresAt = s.expiresAt || 0;
    isCreator = (s.creatorKey === myKey);
    $("btn-extend").style.display = isCreator ? "" : "none";
    if (s.dest && typeof s.dest.lat === "number") { lastDest = s.dest; if (map) showDest(s.dest); }
    if (s.dest) $("my-dest").innerText = s.dest.name || "—";
    if (s.route) { lastRoute = Object.assign({ mode: s.mode }, s.route); drawRoute(); $("my-route").innerText = routeText(); }
    tickClock();
  });
  leftTimer = setInterval(() => {
    tickClock();
    if (expiresAt && Date.now() > expiresAt) expireLeave("時間到，本次共享已結束");
  }, 15000);
  startTracking();
}

function showDest(d) {
  const pos = { lat: d.lat, lng: d.lng };
  if (!destMarker) {
    destMarker = new google.maps.Marker({
      map, position: pos, title: "目的地：" + d.name,
      icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
    });
  } else {
    destMarker.setPosition(pos);
  }
}

function tickClock() {
  if (!expiresAt) { $("my-left").innerText = ""; return; }
  const ms = Math.max(0, expiresAt - Date.now());
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  $("my-left").innerText = "剩" + h + "時" + m + "分";
}

async function doExtend() {
  if (!isCreator || !sessionRef) return;
  await sessionRef.update({ expiresAt: Date.now() + SESSION_MS });
}

function expireLeave(msg) {
  doLeave(msg);
  setTimeout(() => alert(msg), 100);
}

async function doCreate() {
  err("");
  myName = $("in-name").value.trim();
  if (!myName) return err("先輸名稱");
  if (!chosenPlace) return err("目的地請按搜尋後點選一個候選");
  const mode = $("in-mode").value;
  try {
    initFirebase();
    await loadMaps();
    err("定位中…");
    const origin = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
        p => resolve({ name: "現在位置", lat: p.coords.latitude, lng: p.coords.longitude }),
        () => reject(new Error("抓不到定位，請開定位權限再試")),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
    err("規劃路線中…");
    const route = await computeRoute(origin, chosenPlace, mode);
    err("");
    myKey = myName + "_" + Math.random().toString(36).slice(2, 6);
    const code = rndCode();
    await db.ref("sessions/" + code).set({
      createdAt: Date.now(),
      expiresAt: Date.now() + SESSION_MS,
      creatorKey: myKey,
      origin: origin,
      dest: chosenPlace,
      mode: mode,
      route: route
    });
    await enterMap(code);
  } catch (e) { err(e.message); }
}

async function doJoin() {
  err("");
  myName = $("in-name").value.trim();
  const code = $("in-code").value.trim().toUpperCase();
  if (!myName) return err("先輸名稱");
  if (code.length !== 6) return err("代碼要 6 碼");
  try {
    initFirebase();
    await loadMaps();
    const snap = await db.ref("sessions/" + code).get();
    if (!snap.exists()) return err("找不到這個代碼，問發起人確認");
    if (snap.val().expiresAt && Date.now() > snap.val().expiresAt) return err("這個共享已結束，請發起人重開");
    await enterMap(code);
  } catch (e) { err(e.message); }
}

async function doLeave(msg) {
  try {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    if (pushTimer) clearInterval(pushTimer);
    if (leftTimer) clearInterval(leftTimer);
    if (membersRef) membersRef.off();
    if (sessionRef) sessionRef.off();
    if (myRef) { await myRef.onDisconnect().cancel(); await myRef.remove(); }
  } catch (e) {}
  Object.values(markers).forEach(m => m.setMap(null));
  if (destMarker) { destMarker.setMap(null); destMarker = null; }
  if (routeLine) { routeLine.setMap(null); routeLine = null; }
  markers = {}; map = null; myRef = null; membersRef = null; sessionRef = null; myKey = "";
  expiresAt = 0; isCreator = false; lastDest = null; lastRoute = null; lastList = null; myPos = null; peerKey = null;
  if (peerLine) { peerLine.setMap(null); peerLine = null; }
  $("peerinfo").style.display = "none";
  try { localStorage.removeItem("outing_last"); } catch (e) {}
  $("view-map").style.display = "none";
  $("view-home").style.display = "block";
  if (msg) err(msg);
}

function wireSearch(inId, btnId, boxId, cb) {
  let timer = null;
  const run = () => {
    err("");
    const kw = $(inId).value.trim();
    if (!kw) return;
    const box = $(boxId);
    box.innerHTML = "搜尋中…";
    new google.maps.Geocoder().geocode({ address: kw }, (res, status) => {
      if (status !== "OK" || !res || !res.length) {
        box.innerHTML = "";
        return err("找不到地點，換個關鍵字試試");
      }
      box.innerHTML = "";
      res.slice(0, 5).forEach((r, i) => {
        const b = document.createElement("button");
        b.className = "btn-sub";
        b.innerText = (i + 1) + ". " + r.formatted_address;
        b.onclick = () => {
          cb({ name: r.formatted_address, lat: r.geometry.location.lat(), lng: r.geometry.location.lng() });
          $(inId).value = r.formatted_address;
          box.innerHTML = "<div style='color:#15803d;font-weight:bold'>已選：" + r.formatted_address + "</div>";
        };
        box.appendChild(b);
      });
    });
  };
  $(btnId).onclick = run;
  // 打字即聯想（停 600ms 自動搜）
  $(inId).addEventListener("input", () => {
    cb(null);
    $(boxId).innerHTML = "";
    clearTimeout(timer);
    const kw = $(inId).value.trim();
    if (kw.length >= 2) timer = setTimeout(run, 600);
  });
}

function attachAutocomplete() {
  // 目的地搜尋（出發地＝發起時 GPS，不用填）
  wireSearch("in-dest", "btn-search", "dest-results", v => { chosenPlace = v; });
}

$("btn-create").onclick = doCreate;
$("btn-join").onclick = doJoin;
$("btn-leave").onclick = () => doLeave();
$("btn-extend").onclick = doExtend;
// 預載地圖＋地點搜尋（金鑰沒填會在首頁顯示提醒），完後試著恢復上次會話
loadMaps().then(() => { attachAutocomplete(); tryRestore(); }).catch(e => err(e.message + "（先照 README 申請）"));

async function tryRestore() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem("outing_last") || "null"); } catch (e) {}
  if (!s || !s.code || !s.name) return;
  try {
    initFirebase();
    const snap = await db.ref("sessions/" + s.code).get();
    if (!snap.exists() || (snap.val().expiresAt && Date.now() > snap.val().expiresAt)) {
      localStorage.removeItem("outing_last");
      return;
    }
    myName = s.name;
    $("in-name").value = s.name;
    $("in-code").value = s.code;
    await enterMap(s.code);
  } catch (e) {}
}
</script>
